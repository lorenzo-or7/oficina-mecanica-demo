    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('torq-theme')
          var theme = stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
